<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>콘텐츠 관리 | HMIT</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./manage.css"><style>.manage-header img{background:transparent!important;padding:0!important}</style></head>
<body class="manage-page"><header class="manage-header"><a href="./index.html"><img src="./assets/logo-white.svg" alt="HMIT"></a><a href="./index.html">홈페이지로 돌아가기 →</a></header>
<main class="manage-main"><div class="manage-intro"><p class="eyebrow">CONTENT MANAGER</p><h1>고객사와 제품 목록을<br>간편하게 관리하세요.</h1><p>항목을 한 줄에 하나씩 입력해 저장하면 현재 브라우저의 홈페이지에 바로 반영됩니다. 다른 기기나 정식 배포에 반영하려면 설정 파일을 내려받아 관리자에게 전달하세요.</p></div>
<section class="manage-panel"><div class="field"><label for="references-input">고객 레퍼런스 <span id="references-count"></span></label><textarea id="references-input" rows="14" spellcheck="false"></textarea><small>한 줄에 고객사 한 곳</small></div><div class="field"><label for="products-input">파트너 제품 <span id="products-count"></span></label><textarea id="products-input" rows="14" spellcheck="false"></textarea><small>한 줄에 제품 한 개</small></div><div class="manage-actions"><button id="save-content" class="button button-primary" type="button">이 브라우저에 저장 <span>→</span></button><button id="export-content" class="button button-outline" type="button">설정 파일 받기</button><button id="reset-content" class="reset-button" type="button">기본값으로 되돌리기</button></div><p class="save-status" id="save-status" role="status" aria-live="polite"></p></section></main>
<script src="./content.js"></script><script src="./manage.js"></script></body></html>
